<section class="crud-shell">
  <div class="panel">
    <h2>Pessoas</h2>

    <form (ngSubmit)="salvar()" class="form-grid">
      <label>
        <span>Nome</span>
        <input type="text" [(ngModel)]="pessoa.nome" name="nome" />
      </label>

      <label>
        <span>CPF</span>
        <input type="text" [(ngModel)]="pessoa.cpf" name="cpf" />
      </label>

      <label>
        <span>Telefone</span>
        <input type="text" [(ngModel)]="pessoa.telefone" name="telefone" />
      </label>

      <label>
        <span>E-mail</span>
        <input type="email" [(ngModel)]="pessoa.email" name="email" />
      </label>

      <label>
        <span>Sexo</span>
        <input type="text" [(ngModel)]="pessoa.sexo" name="sexo" />
      </label>

      <label>
        <span>Data de nascimento</span>
        <input type="date" [(ngModel)]="pessoa.dataNascimento" name="dataNascimento" />
      </label>

      <label>
        <span>Ativo</span>
        <input type="text" [(ngModel)]="pessoa.ativoPessoa" name="ativoPessoa" />
      </label>

      <div class="address-box">
        <h3>Endereço</h3>
        <label>
          <span>CEP</span>
          <input type="text" [(ngModel)]="pessoa.enderecos[0].cep" name="cep" />
        </label>
        <label>
          <span>Número</span>
          <input type="text" [(ngModel)]="pessoa.enderecos[0].numero" name="numero" />
        </label>
        <label>
          <span>Complemento</span>
          <input type="text" [(ngModel)]="pessoa.enderecos[0].complemento" name="complemento" />
        </label>
      </div>

      <div class="actions">
        <button type="submit">Salvar pessoa</button>
      </div>
    </form>
  </div>

  <div class="panel">
    <h3>Lista de pessoas</h3>
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>CPF</th>
          <th>Email</th>
          <th>Telefone</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let pessoa of pessoas">
          <td>{{ pessoa.nome }}</td>
          <td>{{ pessoa.cpf }}</td>
          <td>{{ pessoa.email }}</td>
          <td>{{ pessoa.telefone }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
