<section class="crud-shell">
  <div class="panel">
    <h2>Categorias</h2>

    <form (ngSubmit)="salvar()" class="form-grid">
      <label>
        <span>ID</span>
        <input type="number" [(ngModel)]="categoria.idcategoria" name="idcategoria" />
      </label>

      <label>
        <span>Categoria</span>
        <input type="text" [(ngModel)]="categoria.categoria" name="categoria" />
      </label>

      <label>
        <span>Items</span>
        <input type="text" [(ngModel)]="itemsInput" name="itemsInput" placeholder="Ex.: Crespo, Nutrição, Tratamento" />
      </label>

      <div class="actions">
        <button type="submit">Salvar categoria</button>
      </div>
    </form>
  </div>

  <div class="panel">
    <h3>Lista de categorias</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Categoria</th>
          <th>Items</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of categorias">
          <td>{{ item.idcategoria }}</td>
          <td>{{ item.categoria }}</td>
          <td>{{ item.items.join(', ') }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
