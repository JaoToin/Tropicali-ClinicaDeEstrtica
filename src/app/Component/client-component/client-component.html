<div id="cadastro">
  <form id="cad" (submit)="enviaDadosAtleta()">

    <h2 class="form-title">Cadastro <span>Tropicalí</span></h2>

    <div class="form-group">

      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" name="nome" [(ngModel)]="nome" placeholder="Digite seu nome">

    </div>

    <div class="form-row">

      <div class="form-group">

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" [(ngModel)]="cpf">

      </div>

      <div class="form-group">

        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone" [(ngModel)]="telefone" placeholder="(00) 00000-0000">

      </div>

    </div>

    <div class="form-group">

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="seuemail@exemplo.com">

    </div>

    <div class="form-group">

      <label>Sexo</label>

      <div class="radio-group">

        <label class="radio-label">

          <input type="radio" name="sexo" id="sexoM" class="bntSelecao" [(ngModel)]="sexo" value="M"> Masculino
        </label>
        <label class="radio-label">
          <input type="radio" name="sexo" id="sexoF" class="bntSelecao" [(ngModel)]="sexo" value="F"> Feminino
        </label>
        <label class="radio-label">
          <input type="radio" name="sexo" id="sexoND" class="bntSelecao" [(ngModel)]="sexo" value="ND"> Não Declarar
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="dataNascimento">Data de Nascimento</label>
      <input type="date" id="dataNascimento" [(ngModel)]="data" name="dataNascimento">
    </div>

    <div class="form-row">
      <div class="form-group flex-2">
        <label for="cep">CEP</label>
        <input type="text" name="cep" id="cep" [(ngModel)]="cep" placeholder="00000-000">
      </div>

      <div class="form-group flex-1">
        <label for="numero">Número</label>
        <input type="text" name="numero" id="numero" [(ngModel)]="numero" placeholder="Nº">
      </div>
    </div>

    <div class="form-group">
      <label for="complemento">Complemento</label>
      <input type="text" name="complemento" id="complemento" [(ngModel)]="complemento" placeholder="Apto, Bloco, Casa...">
    </div>

    <div id="button">

      <button type="submit" id="button_add">
        Cadastrar no Tropicalí
      </button>

    </div>

  </form>

</div>
