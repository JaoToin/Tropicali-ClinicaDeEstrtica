@if (sessao.perfil()) {
  <header id="cabecalho">

    <div id="logo">

        <span id="titulo"><img src="/favicon.ico" alt="Logo"></span>

    </div>

    <nav id="menu">
      <ul id="menu-ul">

        @if (sessao.perfil() === 'loja') {
          <li><a routerLink="/itens" class="lnk-menu"><img src="/IMG/catalogo.png" alt="CATALOGO DE ITENS"></a></li>
          <li><a routerLink="/carrinho" class="lnk-menu"><img src="/IMG/carrinho.png" alt="CARRINHO DE COMPRAS"></a></li>
          <li><a routerLink="/historia" class="lnk-menu"><img src="/IMG/livro.png" alt="NOSSA HISTORIA"></a></li>

        }
        @if (sessao.perfil() === 'adm') {
          <li><a routerLink="/adm/atendimento" class="lnk-menu">Atendimento</a></li>
          <li><a routerLink="/adm/categoria" class="lnk-menu">Categoria</a></li>
          <li><a routerLink="/adm/estoque" class="lnk-menu">Estoque</a></li>
          <li><a routerLink="/adm/funcionarios" class="lnk-menu">Funcionários</a></li>
          <li><a routerLink="/adm/pessoa" class="lnk-menu">Pessoa</a></li>
          <li><a routerLink="/adm/produto" class="lnk-menu">Produto</a></li>
        }

        <li><a class="lnk-menu" (click)="sair()" >❌</a></li>
      </ul>
    </nav>
  </header>
}
