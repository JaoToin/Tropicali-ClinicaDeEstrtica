<main class="main-container">
  <div class="container-cards">

    <!-- Card do Cliente -->
    <a id="card_client" (click)="entrarNaLoja()">
      <h2>Clinica Tropical<span>í</span></h2>
      <p>Beleza com alma, cor e elegância tropical.</p>
      <span class="btn-acessar">Entrar na Clínica &rarr;</span>
    </a>

    <!-- Card Administrativo -->
    <a id="card_adm" (click)="pedindoSenha.set(true)">
      <h2>Gerenciamento Tropical<span>í</span></h2>
      <p>Acesso Restrito</p>
      <span class="btn-acessar">Painel ADM &rarr;</span>
    </a>

  </div>
  @if (pedindoSenha()) {
    <div class="box-senha">
      <div class="box-senha-card">
        <h3>Acesso Restrito</h3>

        <input #campo type="password" placeholder="Senha do administrador"
               (keyup.enter)="entrarNoAdm(campo.value)">

        <div class="box-senha-acoes">
          <button type="button" class="btn-entrar" (click)="entrarNoAdm(campo.value)">Entrar</button>
          <button type="button" class="btn-cancelar" (click)="pedindoSenha.set(false)">Cancelar</button>
        </div>

        @if (erro()) {
          <p class="erro">Senha incorreta.</p>
        }
      </div>
    </div>
  }
</main>
